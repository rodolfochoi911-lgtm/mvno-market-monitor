name: DC event alerts (10 minutes)
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: 'Original scheduled time in ISO 8601 UTC (external scheduler)'
        type: string
        required: false
      schedule_source:
        description: 'Scheduler name for timing diagnostics'
        type: string
        required: false
      dry_run:
        description: 'Preview without sending or changing state'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: dc-event-alerts
  cancel-in-progress: false
jobs:
  poll:
    if: ${{ github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Record external schedule timing
        if: ${{ inputs.scheduled_at != '' }}
        env:
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
          SCHEDULE_SOURCE: ${{ inputs.schedule_source }}
        run: python scripts/run_timing.py
      - name: Check new event posts
        env:
          COPILOT_WEBHOOK_URL: ${{ secrets.COPILOT_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python scripts/dc_event_monitor.py "${args[@]}"

