name: dashboard_history.json → xlsx 변환 및 메일 발송

on:
  push:
    branches: [main]
    paths:
      - 'data/dashboard_history.json'

jobs:
  convert_and_notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 변환된 xlsx를 다시 커밋하기 위해 필요
    steps:
      - uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존 패키지 설치
        run: pip install pandas openpyxl

      - name: JSON → xlsx 변환
        run: python scripts/convert_to_xlsx.py data/dashboard_history.json data/dashboard_history.xlsx

      - name: 변환된 xlsx 커밋
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: dashboard_history.xlsx 자동 갱신"
          file_pattern: data/dashboard_history.xlsx

      - name: 변환 완료 메일 발송 (xlsx 첨부)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "[알림] MVNO 모니터링 데이터 업데이트됨 (${{ github.event.head_commit.timestamp }})"
          to: jiwonchoi@sk.com
          from: MVNO Market Monitor <rodolfochoi911@gmail.com>
          body: |
            dashboard_history.json이 갱신되어 xlsx로 변환 후 첨부합니다.

            커밋: ${{ github.sha }}
            확인: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            시트 구성: Volume / Brand_SOV_Long / Brand_SOV_Pivot / Keywords / Top_Posts
          attachments: data/dashboard_history.xlsx
