name: Market Monitor (Daily)

on:
  schedule:
    # 한국 시간 오전 07:59 (UTC 22:59)
    - cron: '59 22 * * *'


jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Crawler
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        # 파이썬 스크립트에 날짜 인자 전달
        run: |
          python scripts/monitor_crawler.py "${{ github.event.inputs.target_date }}"

      - name: Commit and Push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/ docs/
          git commit -m "Update market data: ${{ github.event.inputs.target_date }}" || echo "No changes to commit"
          git push
