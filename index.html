<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알뜰폰 커뮤니티 모니터링 Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.2rem; color: #555; }
        
        /* 네비게이션 버튼 */
        .nav-btn-group { text-align: center; margin-bottom: 30px; }
        .nav-btn { display: inline-block; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .nav-btn:hover { background-color: #5a6268; }
        .nav-btn-active { background-color: #007bff; pointer-events: none; }

        .chart-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .chart-box { flex: 1; min-width: 400px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 0.9rem; }
        th { background-color: #f8f9fa; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .select-date { margin-bottom: 15px; padding: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 알뜰폰 커뮤니티 모니터링 Dashboard</h1>
        <div class="nav-btn-group">
            <a href="#" class="nav-btn nav-btn-active">현재: 커뮤니티 모니터링</a>
            <a href="./docs/" class="nav-btn">📂 프로모션 체크 보러가기</a>
        </div>
        
        <div class="card">
            <h2>🔥 일별 게시글 화력 (Volume)</h2>
            <canvas id="volumeChart" height="80"></canvas>
        </div>

        <div class="card">
            <div class="chart-row">
                <div class="chart-box">
                    <h2>📈 브랜드 언급량 (SOV)</h2>
                    <canvas id="brandChart"></canvas>
                </div>
                <div class="chart-box">
                    <h2>💬 핫 키워드 (Top 10)</h2>
                    <canvas id="keywordChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🏆 일별 Top 5 핫딜 아카이브</h2>
            <select id="dateSelector" class="select-date" onchange="renderTable()"></select>
            <div id="postsTable"></div>
        </div>
    </div>

    <script>
        let historyData = [];

        async function loadData() {
            try {
                const response = await fetch('data/dashboard_history.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                historyData = await response.json();
                // ✅ 데이터 없을 때 안전하게 처리
                if (!historyData || historyData.length === 0) {
                    document.querySelector('.container').innerHTML += '<div class="card" style="text-align:center;color:#888;padding:40px">⏳ 아직 수집된 데이터가 없습니다. 내일 다시 확인해주세요.</div>';
                    return;
                }
                initCharts();
                initTable();
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.querySelector('.container').innerHTML += `<div class="card" style="text-align:center;color:#c00;padding:40px">❌ 데이터 로드 실패: ${error.message}<br><small>data/dashboard_history.json 파일을 확인해주세요</small></div>`;
            }
        }

        function initCharts() {
            const dates = historyData.map(d => d.date);
            const latest = historyData[historyData.length - 1];
            if (!latest) return;

            // 1. Volume Chart
            new Chart(document.getElementById('volumeChart'), {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        { label: '뽐뿌', data: historyData.map(d => d.total_volume.ppomppu), borderColor: '#ff6b6b', tension: 0.1 },
                        { label: '디시', data: historyData.map(d => d.total_volume.dc), borderColor: '#4ecdc4', tension: 0.1 }
                    ]
                }
            });

            // 2. Brand Chart (SOV)
            const brands = latest.brand_sov || {};
            new Chart(document.getElementById('brandChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(brands),
                    datasets: [{
                        label: '언급 건수',
                        data: Object.values(brands),
                        backgroundColor: '#36a2eb'
                    }]
                },
                options: { indexAxis: 'y' }
            });

            // 3. Keyword Chart
            const keywords = latest.top_keywords || {}; 
            new Chart(document.getElementById('keywordChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(keywords),
                    datasets: [{
                        label: '키워드 빈도',
                        data: Object.values(keywords),
                        backgroundColor: '#ff9f40'
                    }]
                },
                options: { indexAxis: 'y' } 
            });
        }

        function initTable() {
            const selector = document.getElementById('dateSelector');
            [...historyData].reverse().forEach((d) => {
                const option = document.createElement('option');
                option.value = d.date;
                option.text = d.date;
                selector.appendChild(option);
            });
            renderTable();
        }

        function renderTable() {
            const date = document.getElementById('dateSelector').value;
            const data = historyData.find(d => d.date === date);
            const div = document.getElementById('postsTable');
            if (!data) return;

            const renderRows = (posts) => (posts || []).map(p =>
                `<tr><td><a href="${p.link}" target="_blank">${p.title}</a></td><td>${(p.views||0).toLocaleString()}</td><td>${p.comments||0}</td></tr>`
            ).join('') || '<tr><td colspan="3" style="color:#aaa;text-align:center">데이터 없음</td></tr>';

            let html = `<h3>📅 ${date} 인기글</h3>`;
            html += `<h4>뽐뿌 Best</h4><table><thead><tr><th>제목</th><th>조회수</th><th>댓글</th></tr></thead><tbody>`;
            html += renderRows(data.top_posts?.ppomppu);
            html += `</tbody></table>`;

            html += `<h4 style="margin-top:20px;">디시 Best</h4><table><thead><tr><th>제목</th><th>조회수</th><th>댓글</th></tr></thead><tbody>`;
            html += renderRows(data.top_posts?.dc);
            html += `</tbody></table>`;
            div.innerHTML = html;
        }
        loadData();
    </script>
</body>
</html>
